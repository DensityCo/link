# link config for connecting to Fabric Fleet using Shared Secret auth.
#
# Get your key and secret from Fabric Fleet device authentication settings.

host = "https://fleet.fabric.density.ai/"

# Static device serial number for config-backed daemon usage.
serial_number = "my-device-001"

# For production daemon usage, prefer reading active firmware metadata at boot.
# If [device_info] is configured, serial_number and [firmware] can be omitted
# because the source provides the full DeviceInfo JSON.
#
# [device_info]
# source = "json_file"
# path = "/run/link/device-info.json"
#
# [device_info]
# source = "command"
# command = "/usr/bin/link-device-info"
# args = []
# timeout_secs = 5

# Block device that fwup writes firmware to.
# fwup_devpath = "/dev/mmcblk0"
# fwup_task = "upgrade"

# Firmware signing public keys for fwup verification.
# fwup_public_keys = [
#   "REPLACE_WITH_FWUP_PUBLIC_KEY"
# ]

# Optional remote console. This grants shell access through Fabric Fleet.
# [console]
# enabled = true
# version = "2.0.0"
# command = "/bin/sh"
# args = []
# timeout_secs = 300

# Optional device identification command. Use this to blink LEDs or otherwise
# make the physical device visible when Fabric Fleet sends identify.
# [identify]
# enabled = true
# command = "/usr/bin/identify-device"
# args = ["--blink"]

# Optional reboot command. Disabled by default to avoid rebooting development hosts.
# [reboot]
# enabled = true
# command = "reboot"
# args = []
# after_firmware_apply = true
# on_server_request = true

# Optional support scripts. This is remote code execution; keep disabled unless intended.
# The configured command receives the script text on stdin.
# [scripts]
# enabled = true
# command = "/bin/sh"
# args = ["-s"]
# timeout_secs = 10

[auth]
type = "shared_secret"
key = "REPLACE_WITH_DEVICE_OR_PRODUCT_KEY"
secret = "REPLACE_WITH_SHARED_SECRET"

[firmware]
uuid = "00000000-0000-0000-0000-000000000000"
version = "0.0.0"
platform = "rpi4"
architecture = "arm"
product = "my-product"
